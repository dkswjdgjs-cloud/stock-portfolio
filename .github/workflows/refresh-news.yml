name: Refresh news cache

on:
  schedule:
    # 10분마다 (GitHub Actions 스케줄은 부하에 따라 몇 분 지연될 수 있음)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/news/refresh
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEWS_REFRESH_URL }}"
